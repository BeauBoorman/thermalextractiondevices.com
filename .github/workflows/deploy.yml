name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  BORIS_JOBS: 1

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Thermal Extraction Devices
        uses: actions/checkout@v4

      - name: Run repository unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v

      - name: Run Boris provisioner tests
        run: |
          set -euo pipefail
          python3 scripts/test_ensure_boris.py -v

      - name: Load canonical Boris configuration
        id: boris-metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open("metadata/boris-version.json", encoding="utf-8") as handle:
              config = json.load(handle)
          required = ("repository", "branch", "commit", "zig_version")
          if any(not config.get(key) for key in required):
              raise SystemExit("metadata/boris-version.json is missing a required Boris field")
          if not re.fullmatch(r"[0-9a-f]{40}", config["commit"]):
              raise SystemExit("metadata/boris-version.json commit must be a full SHA")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"BORIS_REPOSITORY={config['repository']}\n")
              handle.write(f"BORIS_COMMIT={config['commit']}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"commit={config['commit']}\n")
              handle.write(f"zig_version={config['zig_version']}\n")
          PY

      - name: Set up Zig from canonical metadata
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.boris-metadata.outputs.zig_version }}

      - name: Verify Zig version
        run: test "$(zig version)" = "${{ steps.boris-metadata.outputs.zig_version }}"

      - name: Obtain Boris source at the configured commit
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/boris"
          git -C "$RUNNER_TEMP/boris" remote add origin "$BORIS_REPOSITORY"
          git -C "$RUNNER_TEMP/boris" fetch --depth=1 origin "$BORIS_COMMIT"
          git -C "$RUNNER_TEMP/boris" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/boris" remote get-url origin)" = "$BORIS_REPOSITORY"
          test "$(git -C "$RUNNER_TEMP/boris" rev-parse HEAD)" = "$BORIS_COMMIT"

      - name: Cache Zig compiler directories
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/zig-global-cache
            ${{ runner.temp }}/zig-local-cache
          key: ${{ runner.os }}-zig-${{ steps.boris-metadata.outputs.zig_version }}-${{ steps.boris-metadata.outputs.commit }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ steps.boris-metadata.outputs.zig_version }}-${{ steps.boris-metadata.outputs.commit }}-
            ${{ runner.os }}-zig-${{ steps.boris-metadata.outputs.zig_version }}-

      - name: Build pinned Boris
        working-directory: ${{ runner.temp }}/boris
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache
        run: |
          zig build
          mkdir -p "${{ github.workspace }}/bin"
          cp zig-out/bin/boris "${{ github.workspace }}/bin/boris"
          chmod +x "${{ github.workspace }}/bin/boris"

      - name: Run Thermal Extraction Devices graph validation gate
        env:
          BORIS_BIN: ./bin/boris
          BORIS_JOBS: ${{ env.BORIS_JOBS }}
        run: ./bin/validate_graph.sh

      - name: Build static site output
        env:
          BORIS_BIN: ./bin/boris
          DIST_DIR: dist/cantilever
        run: ./scripts/ted-build.sh

      - name: Deploy to Cloudflare Pages
        # Fork PRs never receive repository secrets, so the deploy step would
        # fail on a missing CLOUDFLARE_API_TOKEN (seen on PR #46). Build/test
        # above still run; only the secret-dependent deploy is skipped.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/cantilever --project-name=thermalextractiondevices
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
