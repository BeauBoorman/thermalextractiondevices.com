name: CI & Graph Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  BORIS_JOBS: 1

jobs:
  validate-and-build:
    name: Validate & Build Site
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -t . -v

      - name: Run Boris provisioner tests
        run: |
          set -euo pipefail
          python3 scripts/test_ensure_boris.py -v

      - name: Load canonical Boris configuration
        id: boris-metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open("metadata/boris-version.json", encoding="utf-8") as handle:
              config = json.load(handle)
          required = ("repository", "branch", "commit", "zig_version")
          if any(not config.get(key) for key in required):
              raise SystemExit("metadata/boris-version.json is missing a required Boris field")
          if not re.fullmatch(r"[0-9a-f]{40}", config["commit"]):
              raise SystemExit("metadata/boris-version.json commit must be a full SHA")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"BORIS_REPOSITORY={config['repository']}\n")
              handle.write(f"BORIS_COMMIT={config['commit']}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"commit={config['commit']}\n")
              handle.write(f"zig_version={config['zig_version']}\n")
          PY

      - name: Set up Zig from canonical metadata
        uses: drawmeanelephant/zig-zouave@2d8510d62b517fa786279562cf8b1bdcf0c47b9f
        with:
          version: ${{ steps.boris-metadata.outputs.zig_version }}

      - name: Verify Zig version
        run: test "$(zig version)" = "${{ steps.boris-metadata.outputs.zig_version }}"

      - name: Obtain Boris compiler
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/boris"
          git -C "$RUNNER_TEMP/boris" remote add origin "$BORIS_REPOSITORY"
          git -C "$RUNNER_TEMP/boris" fetch --depth=1 origin "$BORIS_COMMIT"
          git -C "$RUNNER_TEMP/boris" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/boris" remote get-url origin)" = "$BORIS_REPOSITORY"
          test "$(git -C "$RUNNER_TEMP/boris" rev-parse HEAD)" = "$BORIS_COMMIT"

      - name: Build Boris
        working-directory: ${{ runner.temp }}/boris
        run: |
          zig build
          mkdir -p "${{ github.workspace }}/bin"
          cp zig-out/bin/boris "${{ github.workspace }}/bin/boris"
          chmod +x "${{ github.workspace }}/bin/boris"

      - name: Run graph validation and build
        env:
          BORIS_BIN: ./bin/boris
          BORIS_JOBS: ${{ env.BORIS_JOBS }}
        run: ./bin/validate_graph.sh

      - name: Run public-release audits
        run: |
          set +e
          python3 scripts/audit_public_release.py --config docs/audit-config.json --report /tmp/public-release-report.json
          public_rc=$?
          python3 scripts/audit_sensitive_content.py --config docs/audit-config.json
          sensitive_rc=$?
          python3 scripts/audit_large_files.py --config docs/audit-config.json
          large_rc=$?
          set -e
          if [ "$public_rc" -ne 0 ] || [ "$sensitive_rc" -ne 0 ] || [ "$large_rc" -ne 0 ]; then
            echo "Release audit gate failed: public=$public_rc sensitive=$sensitive_rc large=$large_rc" >&2
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/cantilever/
